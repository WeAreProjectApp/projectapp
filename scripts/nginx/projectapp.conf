server {
    if ($host = www.projectapp.co) {
        return 301 https://$host$request_uri;
    }


    if ($host = projectapp.co) {
        return 301 https://$host$request_uri;
    }


    listen 80;
    server_name projectapp.co www.projectapp.co;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name projectapp.co www.projectapp.co;

    client_max_body_size 10M;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Static files (collected by: python manage.py collectstatic)
    location /static/ {
        alias /home/ryzepeck/webapps/projectapp/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # platform-resource-denial:begin
    # Historical resource paths are never public, even before byte conversion.
    location ^~ /media/deliverables/ {
        return 404;
    }
    location = /media/deliverables {
        return 404;
    }
    # platform-resource-denial:end

    # Media uploads
    location /media/ {
        alias /home/ryzepeck/webapps/projectapp/backend/media/;
        expires 7d;
    }

    # Commercial video bytes live outside /media; Django authorizes each request.
    location /_commercial_videos/ {
        internal;
        alias /home/ryzepeck/webapps/projectapp/backend/private_media/;
        add_header X-Content-Type-Options nosniff;
    }

    # Large bodies are restricted to authenticated/signed upload routes.
    location ~ ^/api/(mcp-uploads/|video-resources/admin/) {
        client_max_body_size 260M;
        client_body_timeout 3600s;
        client_body_buffer_size 128k;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=api burst=10 nodelay;
        include proxy_params;
        proxy_set_header X-Country $geoip2_data_country_code;
        proxy_pass http://unix:/run/projectapp.sock;
    }

    # Uploaded document PDFs: 25 MiB of file bytes plus multipart metadata.
    location ~ ^/api/documents/(create-from-pdf/|[0-9]+/replace-pdf/)$ {
        client_max_body_size 26M;
        error_page 413 = @document_pdf_too_large;
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=api burst=10 nodelay;
        include proxy_params;
        proxy_set_header X-Country $geoip2_data_country_code;
        proxy_pass http://unix:/run/projectapp.sock;
    }

    location @document_pdf_too_large {
        default_type application/json;
        return 413 '{"detail":"El PDF no puede superar 25 MiB; reduce el archivo o sus metadatos."}';
    }

    # MCP assignment validates codecs and extracts a poster after transfer.
    location ~ ^/api/mcp/(partnership-program|additional-modules|proposals|commercial)/ {
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=api burst=10 nodelay;
        include proxy_params;
        proxy_set_header X-Country $geoip2_data_country_code;
        proxy_pass http://unix:/run/projectapp.sock;
    }

    # API endpoints — stricter rate limit
    location /api/ {
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=api burst=10 nodelay;
        include proxy_params;
        # País del visitante (geoip2) para que Django elija el idioma.
        proxy_set_header X-Country $geoip2_data_country_code;
        proxy_pass http://unix:/run/projectapp.sock;
    }

    # Everything else → Gunicorn via Unix socket
    location / {
        include /etc/nginx/snippets/geo-block.conf;
        limit_req zone=general burst=20 nodelay;
        include proxy_params;
        # País del visitante (geoip2) para que Django elija el idioma.
        proxy_set_header X-Country $geoip2_data_country_code;
        proxy_pass http://unix:/run/projectapp.sock;
    }

    ssl_certificate /etc/letsencrypt/live/projectapp.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectapp.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
