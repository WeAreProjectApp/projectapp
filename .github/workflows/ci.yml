name: CI — Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────
  # E2E — flow-definitions.json must match @flow: tags in specs (no npm/Playwright)
  # ───────────────────────────────────────────
  e2e-flow-definitions-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify explainer narration guards
        run: node --test explainers/tests/narration.test.mjs

      - name: Verify flow-definitions ↔ E2E @flow tags
        run: node frontend/scripts/check-flow-definitions-sync.mjs

      - name: Reject native browser dialogs in the panel
        run: node frontend/scripts/check-panel-native-dialogs.mjs

  # ───────────────────────────────────────────
  # Design tokens — fail PR if it adds new color literals to touched files.
  # Legacy files keep working; only files modified in the PR are checked,
  # so the migration stays incremental.
  # ───────────────────────────────────────────
  design-tokens-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect changed Vue/JS/TS files in the PR
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base" "$head" \
            | grep -E '^frontend/(pages|components|layouts)/.*\.(vue|js|ts|jsx|tsx)$' \
            | sed 's|^frontend/||' || true)
          if [ -z "$files" ]; then
            echo "No frontend files touched in this PR"
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            # Print to logs
            echo "Touched files:"
            echo "$files"
            # GitHub Actions output: collapse newlines to space
            echo "files=$(echo "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run design-tokens guard on changed files
        if: steps.changed.outputs.files != ''
        working-directory: frontend
        run: node scripts/check-design-tokens.mjs --strict --files ${{ steps.changed.outputs.files }}

      # --strict-rows: el panel quedó en 0 filas clicables sin enlace, así que
      # la regla gatea desde ya. Ver components/base/README.md → Navigable rows.
      - name: Strict gate on full panel scope
        working-directory: frontend
        run: node scripts/check-design-tokens.mjs --scope=panel --strict --strict-rows

      - name: Verify canonical panel action icons
        working-directory: frontend
        run: node scripts/check-panel-action-icons.mjs

      - name: Verify icon interaction feedback
        working-directory: frontend
        run: node scripts/check-icon-interaction-feedback.mjs

      - name: Verify disabled controls explain themselves
        working-directory: frontend
        run: node scripts/check-disabled-controls.mjs --strict

      - name: Strict gate on full public scope
        working-directory: frontend
        run: node scripts/check-design-tokens.mjs --scope=public --strict

  # ───────────────────────────────────────────
  # Backend — pytest (Django + SQLite), sharded
  #
  # The suite runs 45 min of pure execution on one runner, and it was the sole
  # job alive for the last ~25 minutes of every run. Split by MEASURED duration
  # (scripts/ci/backend-shard-files.py), not by test count or module: services/
  # holds 29% of the tests and 9% of the time, so any count-based split lands
  # 3-to-1 lopsided and the slowest shard sets the wall clock anyway.
  #
  # Six shards, not more: each one costs ~1.1 min of fixed setup (deps, then the
  # test database and its 320 migrations, which do not divide), so the curve is
  # 1.1 + 45/N. Six lands the backend at ~8.7 min, which puts it BELOW the E2E
  # block — the block closes at T+15 and is what the whole run waits on now.
  # Past six the backend is already off the critical path and extra shards only
  # buy queue pressure.
  #
  # Coverage is combined in backend-coverage-merge, which owns the floor: a
  # per-shard --cov-fail-under would measure a fraction of the codebase and fail
  # every time.
  # ───────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      # One red domain must not hide the state of the other three.
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare isolated nginx for private media HTTP tests
        run: |
          FILES=$(python3 "$GITHUB_WORKSPACE/scripts/ci/backend-shard-files.py" --shard ${{ matrix.shard }})
          if [[ "$FILES" == *"test_platform_resource_media_http.py"* ]]; then
            task_nginx_dir="$RUNNER_TEMP/platform-media-nginx"
            mkdir -p "$task_nginx_dir"
            cd "$task_nginx_dir"
            apt-get download nginx
            for task_nginx_package in nginx_*.deb; do
              dpkg-deb -x "$task_nginx_package" "$task_nginx_dir/extracted"
            done
            printf 'PLATFORM_MEDIA_NGINX_BINARY=%s\n' "$task_nginx_dir/extracted/usr/sbin/nginx" >> "$GITHUB_ENV"
            "$task_nginx_dir/extracted/usr/sbin/nginx" -V
          fi

      - name: Install Chromium for template validation tests
        run: |
          FILES=$(python3 "$GITHUB_WORKSPACE/scripts/ci/backend-shard-files.py" --shard ${{ matrix.shard }})
          if [[ "$FILES" == *"test_linktree_template_browser"* ]]; then
            python -m playwright install --with-deps chromium
          fi

      - name: Verify the shards cover the whole suite
        # Cheap guard against the real failure mode of a split: a test file that
        # silently stops running. Every discovered file must land in exactly one
        # shard.
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-shard-files.py" --check 6

      - name: Run pytest with coverage (shard ${{ matrix.shard }})
        # No --cov-report and no --cov-fail-under here: this shard only produces
        # a partial .coverage data file, which backend-coverage-merge combines.
        run: |
          FILES=$(python3 "$GITHUB_WORKSPACE/scripts/ci/backend-shard-files.py" --shard ${{ matrix.shard }})
          pytest -v --tb=short --junitxml=pytest-results.xml --cov-report= $FILES

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # strategy.job-index, not matrix.shard: upload-artifact@v4 needs unique
          # names and "1/4" carries a slash. Same reason the E2E shards do it.
          name: backend-shard-${{ strategy.job-index }}
          path: |
            backend/.coverage*
            backend/pytest-results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────
  # Backend — combine the sharded coverage and enforce the floor
  # Mirrors e2e-merge-reports: the verdict comes from the aggregate, never from
  # a shard. Publishes the SAME artifact name and shape the single job used to,
  # so coverage-summary and its PR comment keep working untouched.
  # ───────────────────────────────────────────
  backend-coverage-merge:
    if: always()
    needs: [backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: backend/shard-artifacts
          merge-multiple: false

      - name: Combine coverage and merge junit
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-merge-shards.py"

      - name: Enforce the backend coverage floor
        # The floor lives here now, on the combined data. QA campaigns 1-3 left
        # the suite at ~93%; raise it as coverage grows, never lower it.
        run: coverage report --rcfile=coverage.ini --fail-under=92.5

      - name: Backend coverage summary
        if: always()
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/backend-job-summary.py" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            backend/coverage-backend.json
            backend/pytest-results.xml
          if-no-files-found: error
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Jest unit & component tests
  # ───────────────────────────────────────────
  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Validate view catalog and operational taxonomy
        run: npm run check:view-catalog

      - name: Run Jest tests with coverage
        # --maxWorkers=100%: the 524 suites add up to 48.4 min of work and the
        # job resolved them in 16.75 min of wall clock, i.e. 2.9 effective
        # workers — jest's default of `cores - 1` on a 4-core runner. The runner
        # is a dedicated, throwaway machine, so leaving a core idle buys nothing
        # here. It stays on the command and OUT of jest.config.cjs on purpose:
        # locally, taking every core makes the machine unusable while tests run,
        # and there the default is the right one.
        # If this ever turns flaky or OOMs, --maxWorkers=3 pins today's
        # behaviour explicitly instead of falling back to the implicit default.
        run: |
          NODE_OPTIONS='--no-deprecation' npx jest --config jest.config.cjs --coverage --ci --maxWorkers=100% --forceExit --json --outputFile=jest-results.json || true
          node scripts/coverage-summary.cjs
          # Fail the step if tests failed
          node --input-type=commonjs -e "const r=require('./jest-results.json'); if(!r.success) process.exit(1);"

      - name: Copy test results alongside coverage
        if: always()
        run: cp jest-results.json coverage/ 2>/dev/null || true

      - name: Enforce frontend coverage floors
        # The jest step swallows exit codes (|| true), so a jest
        # coverageThreshold would never fail CI — enforce the floors here
        # instead (QA campaigns 1-3 left the suite at ~85.5% / ~82%);
        # raise them as coverage grows, never lower them.
        run: |
          node --input-type=commonjs -e "
            const total = require('./coverage/coverage-summary.json').total;
            const floors = { statements: 85, branches: 81 };
            const below = Object.entries(floors)
              .filter(([metric, min]) => total[metric].pct < min)
              .map(([metric, min]) => metric + ' ' + total[metric].pct + '% < ' + min + '%');
            if (below.length) { console.error('Coverage below floor: ' + below.join(', ')); process.exit(1); }
            console.log('Coverage floors OK: statements ' + total.statements.pct + '% >= 85%, branches ' + total.branches.pct + '% >= 81%');
          "

      - name: Frontend unit coverage summary
        if: always()
        run: node "$GITHUB_WORKSPACE/scripts/ci/frontend-job-summary.cjs" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload frontend-unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-unit
          path: |
            frontend/coverage/coverage-summary.json
            frontend/coverage/jest-results.json
          if-no-files-found: error
          retention-days: 5

  # ───────────────────────────────────────────
  # Frontend — Playwright E2E tests (sharded)
  # ───────────────────────────────────────────
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    # Azure's Ubuntu mirror can spend more than 25 minutes downloading the
    # Playwright system fonts; the test load itself stays capped at 87/shard.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/15", "2/15", "3/15", "4/15", "5/15", "6/15", "7/15", "8/15", "9/15", "10/15", "11/15", "12/15", "13/15", "14/15", "15/15"]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Playwright browsers with system deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }} --reporter=blob
        env:
          CI: 'true'

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ strategy.job-index }}
          path: frontend/blob-report/
          retention-days: 1

      - name: Upload test traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: frontend/test-results/
          retention-days: 7

  # Real Django forms/session/JWT against an isolated test database.
  login-captcha-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise CAPTCHA on both real login forms
        working-directory: frontend
        run: npx playwright test --config playwright.captcha.config.js panel-login-captcha.spec.js platform-login-captcha.spec.js --reporter=blob
        env:
          CI: 'true'
      - name: Upload CAPTCHA blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-captcha
          path: frontend/blob-report/
          retention-days: 1
      - name: Upload CAPTCHA failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-captcha
          path: frontend/test-results/
          retention-days: 7

  # Delivery decisions run against real JWT APIs and a disposable test database.
  frontend-delivery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise contractual delivery with real admin and client APIs
        working-directory: frontend
        run: npm run e2e:delivery -- --reporter=blob
        env:
          CI: 'true'
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-delivery.zip
      - name: Upload delivery blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-delivery
          path: frontend/blob-report/
          retention-days: 1
      - name: Upload delivery failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-delivery
          path: frontend/test-results/
          retention-days: 7

  frontend-issue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise contextual tickets with real admin and client APIs
        working-directory: frontend
        run: npm run e2e:issues -- --reporter=blob
        env:
          CI: 'true'
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-issues.zip
      - name: Upload issue blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-issues
          path: frontend/blob-report/
          retention-days: 1
      - name: Upload issue failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-issues
          path: frontend/test-results/
          retention-days: 7

  # Worker registration and offline navigation require the real Django build.
  frontend-pwa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Generate the Django frontend
        run: npm --prefix frontend run build:django
      - name: Exercise installation and offline recovery against Django
        working-directory: frontend
        run: npx playwright test --config playwright.pwa.config.js admin/admin-pwa-install.spec.js pwa/panel-offline.spec.js --reporter=blob
        env:
          CI: 'true'
      - name: Upload PWA blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-pwa
          path: frontend/blob-report/
          retention-days: 1
      - name: Upload PWA failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-pwa
          path: frontend/test-results/
          retention-days: 7

  # ───────────────────────────────────────────
  # E2E — Merge sharded results + flow coverage
  # flow-coverage.json: see docs/E2E_FLOW_COVERAGE_REPORT_STANDARD.md
  # ───────────────────────────────────────────
  # P4 real API specs contribute to this run's mandatory flow aggregate.
  frontend-project-collaboration-tests:
    uses: ./.github/workflows/project-collaboration.yml
    permissions:
      contents: read

  e2e-merge-reports:
    if: always()
    needs: [frontend-e2e-tests, frontend-pwa-tests, login-captcha-tests, frontend-delivery-tests, frontend-issue-tests, frontend-project-collaboration-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: frontend/all-blob-reports
          merge-multiple: true

      - name: Merge into HTML + JSON report
        run: npx playwright merge-reports --reporter='json,./e2e/reporters/flow-coverage-reporter.mjs' all-blob-reports
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results/playwright-results.json

      - name: E2E flow coverage — job summary + P1 missing gate
        if: always()
        run: npm run ci:e2e-flow-summary

      - name: Upload E2E flow coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-e2e
          path: |
            frontend/e2e-results/flow-coverage.json
            frontend/e2e-results/playwright-results.json
          if-no-files-found: error
          retention-days: 5

  # ───────────────────────────────────────────
  # Coverage Summary — aggregates all reports
  # ───────────────────────────────────────────
  coverage-summary:
    if: always()
    needs: [backend-coverage-merge, frontend-unit-tests, e2e-merge-reports]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage-artifacts/backend
        continue-on-error: true

      - name: Download frontend-unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-unit
          path: coverage-artifacts/frontend-unit
        continue-on-error: true

      - name: Download frontend-e2e coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-e2e
          path: coverage-artifacts/frontend-e2e
        continue-on-error: true

      - name: Generate coverage summary
        if: always()
        id: summary
        run: node scripts/coverage-summary-ci.cjs

      - name: Write Job Summary
        if: always()
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-md
          path: coverage-report.md
          retention-days: 5

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-report.md
