name: Project ideas and client access
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: project-collaboration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project-collaboration-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
          pip install -r backend/requirements.txt
          npm --prefix frontend ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Certify mail isolation before database and fixtures
        run: python backend/accounts/tests/project_collaboration_browser_server.py --check-isolation
        env:
          CI: 'true'
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise ideas and field visibility through real APIs
        working-directory: frontend
        run: npx playwright test --config=playwright.project-collaboration.config.js project-collaboration/ideas.spec.js project-collaboration/client-access.spec.js
        env:
          CI: 'true'
      - name: Upload P4 browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-collaboration-results
          path: |
            frontend/e2e-results/project-collaboration.json
            frontend/test-results/
          retention-days: 7
