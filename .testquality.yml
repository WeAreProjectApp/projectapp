# .testquality.yml - per-project configuration for the test quality gate.
#
# Generated from this project's own gate copy when the canonical core was
# adopted, so behaviour is preserved exactly. Edit freely; the sync script
# never overwrites this file.

backend_app_name: "*"
py_test_file_glob: test_*.py
frontend_unit_dir: test
frontend_e2e_dir: e2e
max_test_lines: 50
min_test_lines: 3
max_assertions_per_test: 7
max_patches_per_test: 5
min_lines_for_docstring: 15
max_timeout_ms: 100

py_allowed_folders:
  - "."
  - "commands"
  - "management"
  - "models"
  - "permissions"
  - "serializers"
  - "services"
  - "tasks"
  - "utils"
  - "views"

js_unit_suffixes:
  - ".test.js"
  - ".spec.js"
  - ".test.ts"
  - ".spec.ts"

js_e2e_suffixes:
  - ".spec.js"
  - ".spec.ts"

banned_tokens:
  - "batch"
  - "coverage"
  - "cov"
  - "deep"
flow_definitions_dir: flows

# --- Performance (consumido por /perf-pass; el quality gate lo IGNORA) ---
# performance_dataset_ceiling: ["monitoring.Case=10000"]
# performance_query_budget_default: 6
# performance_query_budget_detail: 4
# performance_query_budget_mutation: 8
# performance_page_size_max: 100
# performance_task_budget_s: 30
# performance_payload_kb: 256
# performance_bundle_kb: ["initial=300", "route=150"]
# performance_index_threshold_rows: 10000
performance_paths:
  - "monitoring=backend/monitoring,frontend/pages/panel/monitoring,frontend/stores/monitoring.js"
  - "platform=backend/accounts/views.py,backend/accounts/serializers.py"
# performance_exclude: ["module=razón de exclusión"]
# performance_project_doc: docs/methodology/performance-standard.md
# performance_host_override: vps-projectapp-staging
performance_budget_tests:
  - backend/monitoring/tests/test_query_budget.py
  - backend/monitoring/tests/test_retention.py
  - backend/accounts/tests/test_project_scope_items_endpoint.py
  - backend/accounts/tests/test_requirements.py
  - backend/accounts/tests/test_payments.py
  - backend/accounts/tests/test_deliverables.py
  - backend/accounts/tests/test_change_requests.py
  - backend/accounts/tests/test_bug_reports.py
  - backend/accounts/tests/test_client_list_aggregates.py
  - backend/accounts/tests/test_project_list_aggregates.py
  - backend/accounts/tests/test_project_phases.py
  - backend/accounts/tests/test_notifications.py
  - backend/accounts/tests/test_bulk_evaluation.py
  - backend/accounts/tests/test_detail_query_budgets.py
  - backend/accounts/tests/test_selector_query_budgets.py
performance_silk_reports: backend/logs/monitoring

# Responsive overrides consumed by the fleet's responsive ledger. ProjectApp
# intentionally uses its panel vocabulary and the 835x1195 portrait viewport;
# leaving these implicit made the ledger report the generic 835x1194 matrix and
# only the flow-registry modules instead of the thirteen acceptance owners.
responsive_widths:
  - compact=412x915
  - portrait=835x1195
  - landscape=1195x835
  - desktop=1440x900
  - wide=2560x1440

responsive_breakpoints:
  - panel-portrait=640
  - panel-landscape=1024
  - panel-desktop=1280
  - panel-wide=1920

responsive_breakpoints_source: frontend/config/responsive.js
responsive_project_doc: docs/methodology/responsive-standard.md
responsive_viewport_helper: frontend/e2e/helpers/viewports.js

responsive_modules:
  - foundation
  - accounting
  - documents
  - clients
  - projects
  - commercial
  - emails
  - communications
  - canvas
  - dashboard
  - content
  - mcp
  - public

responsive_module_paths:
  - "foundation=frontend/assets/styles,frontend/components/base,frontend/components/panel/PanelMobileDrawer.vue,frontend/components/panel/PanelSidebar.vue,frontend/composables/usePanelSidebar.js,frontend/config/responsive.js,frontend/layouts/admin.vue,frontend/pages/panel/styleguide.vue,frontend/tailwind.config.js"
  - "accounting=frontend/components/accounting,frontend/pages/panel/accounting"
  - "documents=frontend/components/panel/documents,frontend/pages/panel/documents/index.vue,frontend/pages/panel/documents/statuses.vue"
  - "clients=frontend/components/clients,frontend/components/platform,frontend/layouts/platform.vue,frontend/pages/panel/clients,frontend/pages/platform"
  - "projects=frontend/components/panel/projects,frontend/pages/panel/projects,frontend/pages/panel/monitoring"
  - "commercial=frontend/components/AdditionalModules/CatalogOrderModal.vue,frontend/components/AdditionalModules/CatalogSelectionModal.vue,frontend/components/AdditionalModules/CategoryManagerModal.vue,frontend/components/AdditionalModules/ModuleFormModal.vue,frontend/components/AdditionalModules/ShareHistoryModal.vue,frontend/components/BusinessProposal/admin,frontend/components/WebAppDiagnostic/admin,frontend/components/proposals,frontend/pages/panel/additional-modules,frontend/pages/panel/defaults.vue,frontend/pages/panel/diagnostics,frontend/pages/panel/hour-packages,frontend/pages/panel/proposals"
