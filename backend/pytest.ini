[pytest]
DJANGO_SETTINGS_MODULE = projectapp.settings_test
# Los cuatro roots, explicitos: `backend/tests/` y `projectapp/tests/` se
# olvidan facil — el propio test-quality-gate reporto 379 archivos en vez de 381
# por omitirlos. Declararlos aca los hace visibles y mantiene en un solo lugar la
# lista que consume scripts/ci/backend-shard-files.py.
testpaths = accounts/tests content/tests tests projectapp/tests monitoring/tests secure_links/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --cov=content --cov=accounts --cov=projectapp --cov=monitoring --cov=secure_links --cov-branch --cov-config=coverage.ini
